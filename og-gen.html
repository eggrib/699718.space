<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #020617; font-family: 'Segoe UI', sans-serif; }
  .bg {
    position: absolute; inset: 0;
    background: 
      radial-gradient(ellipse at 0% 0%, rgba(99,102,241,0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(168,85,247,0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(79,70,229,0.1) 0%, transparent 70%),
      #020617;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .content {
    position: relative; z-index: 10;
    height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding: 80px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
    border-radius: 100px; padding: 6px 16px; margin-bottom: 32px; width: fit-content;
  }
  .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
  .badge-text { font-size: 13px; color: #34d399; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
  .name {
    font-size: 120px; font-weight: 900; letter-spacing: -4px; line-height: 1;
    background: linear-gradient(90deg, #818cf8, #c084fc, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }
  .subtitle {
    font-size: 24px; color: #94a3b8; max-width: 700px; line-height: 1.5; margin-bottom: 48px;
  }
  .tags { display: flex; gap: 12px; flex-wrap: wrap; }
  .tag {
    background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
    border-radius: 8px; padding: 8px 20px; font-size: 15px; color: #a5b4fc; font-weight: 600;
  }
  .domain {
    position: absolute; bottom: 48px; right: 80px;
    font-size: 18px; color: rgba(148,163,184,0.5); letter-spacing: 2px;
  }
  .corner-glow {
    position: absolute; right: -100px; top: -100px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(168,85,247,0.2) 0%, transparent 70%);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="corner-glow"></div>
  <div class="content">
    <div class="badge">
      <div class="dot"></div>
      <span class="badge-text">Available for projects</span>
    </div>
    <div class="name">eggrib</div>
    <div class="subtitle">Full-Cycle Engineer — Go · Python · DevOps · Algo Trading</div>
    <div class="tags">
      <div class="tag">⚡ Go Backend</div>
      <div class="tag">🤖 LLM Bots</div>
      <div class="tag">📈 Algo Trading</div>
      <div class="tag">🐳 DevOps</div>
      <div class="tag">🔒 VPN Infra</div>
    </div>
  </div>
  <div class="domain">699718.space</div>
</body>
</html>
